<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>ULTIMATE BUS WORLD 3D</title>
<style>
:root{--y:#ffc933;--y2:#ff9d00;--bg:#0c1220;--pn:rgba(13,19,34,.93);--tx:#eef3ff;--mut:#8fa0c0;--ok:#4ade80;--bad:#f87171;--bl:#38bdf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',Roboto,'Trebuchet MS',Arial,sans-serif;color:var(--tx);touch-action:none;overscroll-behavior:none}
#gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block;background:#7ab8ff}
.screen{position:fixed;left:0;top:0;right:0;bottom:0;display:none}
.screen.on{display:block}
button{font-family:inherit;cursor:pointer;border:0;outline:0;color:inherit}
.btn{display:inline-block;padding:12px 22px;font-weight:900;letter-spacing:1.5px;font-size:15px;border-radius:6px;background:linear-gradient(#ffd54a,#ff9d00);color:#2a1a00;box-shadow:0 5px 0 #9a5500,0 9px 16px rgba(0,0,0,.45);transition:transform .08s,filter .15s;text-transform:uppercase}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #9a5500}
.btn.sec{background:linear-gradient(#4b5b7d,#303c58);color:#fff;box-shadow:0 5px 0 #151c2e,0 9px 16px rgba(0,0,0,.45)}
.btn.bad{background:linear-gradient(#ff7a7a,#d63a3a);color:#fff;box-shadow:0 5px 0 #7d1818}
.btn.ok{background:linear-gradient(#6cf5a0,#22b45c);color:#06280f;box-shadow:0 5px 0 #0e6a33}
.btn.sm{padding:7px 12px;font-size:12px;box-shadow:0 3px 0 #9a5500}
.btn.sec.sm{box-shadow:0 3px 0 #151c2e}
.btn[disabled]{filter:grayscale(1) brightness(.6);pointer-events:none}
/* loading */
#loading{background:radial-gradient(circle at 50% 40%,#1c2c52,#070b16);z-index:50;text-align:center}
#loading .in{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,88vw)}
.logo{font-weight:900;font-size:clamp(30px,6vw,60px);line-height:1;color:var(--y);letter-spacing:2px;text-shadow:0 1px 0 #c77700,0 2px 0 #c77700,0 3px 0 #c77700,0 4px 0 #a35a00,0 5px 0 #a35a00,0 6px 0 #804300,0 10px 18px rgba(0,0,0,.6)}
.logo small{display:block;font-size:.42em;color:#fff;letter-spacing:10px;text-shadow:0 3px 0 #1a2a55,0 5px 12px #000}
.bar{height:16px;border-radius:4px;background:#0a1020;border:3px solid #2a3860;overflow:hidden;margin:22px 0 10px}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#ffc933 0 12px,#ffad00 12px 24px);transition:width .2s}
#loadTxt{color:var(--mut);font-size:14px;min-height:20px}
#loadTip{margin-top:22px;color:#c9d6f5;font-size:13px;opacity:.8}
/* menu */
#menu{z-index:20;background:linear-gradient(90deg,rgba(5,9,20,.82) 0,rgba(5,9,20,.45) 38%,rgba(0,0,0,0) 70%)}
#menu .ttl{position:absolute;left:5vw;top:6vh}
#menuBtns{position:absolute;left:5vw;top:30vh;display:flex;flex-direction:column;gap:11px;width:min(300px,60vw)}
#menuBtns .btn{width:100%;text-align:left;font-size:16px;padding:12px 20px;animation:slideIn .5s both}
#menuBtns .btn:nth-child(1){animation-delay:.05s}#menuBtns .btn:nth-child(2){animation-delay:.1s}#menuBtns .btn:nth-child(3){animation-delay:.15s}#menuBtns .btn:nth-child(4){animation-delay:.2s}#menuBtns .btn:nth-child(5){animation-delay:.25s}#menuBtns .btn:nth-child(6){animation-delay:.3s}#menuBtns .btn:nth-child(7){animation-delay:.35s}#menuBtns .btn:nth-child(8){animation-delay:.4s}
@keyframes slideIn{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
#menuInfo{position:absolute;right:3vw;top:3vh;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.chip{background:var(--pn);border:2px solid #2a3860;border-radius:6px;padding:6px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.chip.small{font-size:11px;padding:3px 8px}
#menuBus{position:absolute;right:4vw;bottom:5vh;text-align:right;text-shadow:0 2px 6px #000}
#menuBus b{font-size:22px;color:var(--y)}
.cube{position:absolute;width:26px;height:26px;background:linear-gradient(135deg,#ffd54a,#e58a00);border:2px solid #7a4300;opacity:.55;animation:fl 9s infinite ease-in-out;box-shadow:inset -6px -6px 0 rgba(0,0,0,.2)}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-40px) rotate(45deg)}}
/* panels */
#panel{z-index:30;background:rgba(3,6,14,.72);backdrop-filter:blur(3px)}
.pbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1040px,95vw);max-height:92vh;display:flex;flex-direction:column;background:var(--pn);border:3px solid #2a3860;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.7);animation:pop .25s both}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%)}}
.phead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:3px solid #2a3860;gap:10px}
.phead h2{margin:0;font-size:clamp(18px,3vw,26px);color:var(--y);letter-spacing:2px}
#pbody{padding:16px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:linear-gradient(#18223c,#111a30);border:2px solid #2a3860;border-radius:8px;padding:12px;position:relative}
.card.sel{border-color:var(--y);box-shadow:0 0 0 2px rgba(255,201,51,.3)}
.card.lock{opacity:.6}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:3px 0;color:var(--mut);font-size:12.5px;line-height:1.35}
.tag{display:inline-block;font-size:10px;font-weight:900;padding:2px 7px;border-radius:3px;margin-right:4px;background:#2a3860;letter-spacing:1px}

.stat{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);margin:2px 0}.stat span{width:58px}.stat div{flex:1;height:7px;background:#0a1020;border-radius:2px;overflow:hidden}.stat i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#4ade80)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 4px;border-bottom:1px solid #212c4a}

#mapC{width:100%;background:#0a1020;border-radius:8px;border:2px solid #2a3860;touch-action:none;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:8px}

/* HUD */

#topL{position:absolute;left:max(10px,env(safe-area-inset-left));top:10px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}

#topR{position:absolute;right:max(10px,env(safe-area-inset-right));top:10px;text-align:right}

#toasts{position:absolute;left:50%;top:80px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:var(--pn);border:2px solid var(--y);border-radius:6px;padding:7px 14px;font-weight:800;font-size:14px;animation:tin .25s both;white-space:nowrap}
.toast.g{border-color:var(--ok)}.toast.r{border-color:var(--bad)}

#boardBar{position:absolute;left:50%;top:30vh;transform:translateX(-50%);background:var(--pn);border:2px solid var(--bl);border-radius:8px;padding:8px 16px;font-weight:800;display:none;text-align:center}

/* touch */
#touch{position:fixed;left:0;top:0;right:0;bottom:0;z-index:12;pointer-events:none;display:none}
body.touch #touch.on{display:block}
.tb{pointer-events:auto;position:absolute;border-radius:14px;background:rgba(12,18,34,.55);border:3px solid rgba(255,255,255,.35);color:#fff;font-weight:900;font-size:clamp(11px,2.6vmin,18px);display:flex;align-items:center;justify-content:center;touch-action:none;text-align:center;line-height:1.05;backdrop-filter:blur(2px)}
.tb.act{background:rgba(255,201,51,.65);border-color:#fff;transform:scale(.95)}
.tb.rnd{border-radius:50%}
#tbL{left:3vmin;bottom:4vmin;width:19vmin;height:19vmin;font-size:8vmin}
#tbR{left:25vmin;bottom:4vmin;width:19vmin;height:19vmin;font-size:8vmin}
#tbGas{right:3vmin;bottom:4vmin;width:20vmin;height:30vmin;background:rgba(40,160,80,.5);font-size:3.4vmin}
#tbBrk{right:26vmin;bottom:4vmin;width:18vmin;height:21vmin;background:rgba(200,50,50,.5);font-size:3vmin}
#tbRev{right:3vmin;bottom:36vmin;width:12vmin;height:12vmin}
#tbHand{right:26vmin;bottom:27vmin;width:12vmin;height:12vmin}
#tbHorn{left:3vmin;bottom:26vmin;width:12vmin;height:12vmin}
#tbGear{left:17vmin;bottom:26vmin;width:12vmin;height:12vmin}
#tbUp{left:31vmin;bottom:26vmin;width:11vmin;height:11vmin;display:none}
#tbDn{left:43vmin;bottom:26vmin;width:11vmin;height:11vmin;display:none}
body.manual #tbUp,body.manual #tbDn{display:flex}
#tbCam{right:3vmin;top:26vmin;width:11vmin;height:11vmin}
#tbLight{right:16vmin;top:26vmin;width:10vmin;height:10vmin}
#tbIL{right:28vmin;top:26vmin;width:10vmin;height:10vmin}
#tbIR{right:40vmin;top:26vmin;width:10vmin;height:10vmin}
#touch.lay-mir #tbL{left:auto;right:25vmin}#touch.lay-mir #tbR{left:auto;right:3vmin}
#touch.lay-mir #tbGas{right:auto;left:3vmin}#touch.lay-mir #tbBrk{right:auto;left:26vmin}
#touch.lay-mir #tbRev{right:auto;left:3vmin}#touch.lay-mir #tbHand{right:auto;left:26vmin}
#touch.lay-mir #tbHorn{left:auto;right:3vmin}#touch.lay-mir #tbGear{left:auto;right:17vmin}
#touch.lay-mir #tbUp{left:auto;right:31vmin}#touch.lay-mir #tbDn{left:auto;right:43vmin}
#touch.lay-tilt #tbL,#touch.lay-tilt #tbR{display:none}
body.touch #speedo{width:150px;height:110px}
body.touch .gbars{display:none}
body.touch #dash{bottom:2px}
body.touch #mini{width:110px;height:110px}
body.touch #limitSign{top:160px;width:42px;height:42px;font-size:15px;border-width:5px}
/* pause / result */
#pause,#result{z-index:40;background:rgba(3,6,14,.75);backdrop-filter:blur(3px)}
.mbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--pn);border:3px solid #2a3860;border-radius:12px;padding:22px;width:min(420px,92vw);text-align:center;display:flex;flex-direction:column;gap:11px;max-height:94vh;overflow:auto}
.mbox h2{margin:0 0 6px;color:var(--y);letter-spacing:3px}
.rs{display:flex;justify-content:space-between;font-weight:700;border-bottom:1px solid #212c4a;padding:5px 2px}
@media (max-height:520px){#menuBtns{top:24vh;gap:6px;display:grid;grid-template-columns:1fr 1fr;width:min(520px,70vw)}#menuBtns .btn{padding:8px 12px;font-size:13px}#menu .ttl{top:3vh}}
@media (max-width:700px){#missionBox{top:auto;bottom:calc(120px + 2vmin);width:60vw;display:none}.pbox{max-height:96vh}}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   ULTIMATE BUS WORLD 3D  -  single file native WebGL voxel bus simulator
   ===================================================================== */
const E=id=>document.getElementById(id);
const CUR=String.fromCharCode(36);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const TAU=Math.PI*2,PI=Math.PI;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash2(x,y,s){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul((s|0)+1,1274126177))|0;h=Math.imul(h^(h>>>13),1103515245);h^=h>>>16;h=Math.imul(h,2246822519);h^=h>>>13;return(h>>>0)/4294967296;}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,s,o){let a=.5,f=1,t=0,n=0;for(let i=0;i<o;i++){t+=a*vnoise(x*f,y*f,s+i*17);n+=a;a*=.5;f*=2;}return t/n;}
const C3=h=>[(h>>16&255)/255,(h>>8&255)/255,(h&255)/255];
const mulc=(c,f)=>[c[0]*f,c[1]*f,c[2]*f];
const mixc=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const ONE3=[1,1,1];

/* ---------- particles ---------- */
const PART=[];const PBUF=new Float32Array(10*400);
function emitPart(x,y,z,vx,vy,vz,col,life){if(PART.length>=300)return;PART.push({x:x,y:y,z:z,vx:vx+(Math.random()-0.5)*0.6,vy:vy,vz:vz+(Math.random()-0.5)*0.6,l:life,m:life,c:col});}
function updateParticles(dt){for(let i=PART.length-1;i>=0;i--){const p=PART[i];p.l-=dt;if(p.l<=0){PART.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;}}

/* ---------- stops, passengers, services ---------- */
const STOPS=new Map();
function stopWaiting(n){let s=STOPS.get(n.key);if(!s){s={n:Math.floor(hash2(n.i,n.j,200)*(n.city?9:5)),t:0};STOPS.set(n.key,s);}return s;}
function nodeByKey(k){const j=((k%100003)+100003)%100003;let jj=j>50001?j-100003:j;const i=Math.round((k-jj)/100003);return nodeInfo(i,jj);}
function pickDest(n){
 for(let t=0;t<10;t++){const dd=1+Math.floor(Math.random()*4),sg=Math.random()<0.5?-1:1;const m=Math.random()<0.5?nodeInfo(n.i+sg*dd,n.j):nodeInfo(n.i,n.j+sg*dd);if(m.valid&&m.key!==n.key)return m;}
 return nodeInfo(n.i+1,n.j);
}
function syncPax(){setPaxMesh(P.model,P.pax.length);}
function updateStops(dt){
 for(const s of STOPS.values()){if(s.n<=0){s.t+=dt;if(s.t>100){s.t=0;s.n=2+Math.floor(Math.random()*7);}}}
 const n=stopAt(P.x,P.z);P.atStop=null;
 if(!n||Math.abs(P.vf)>1.2){P.dwell=0;return;}
 P.atStop=n;P.dwell+=dt;P.boardT-=dt;
 if(P.dwell<0.8||P.boardT>0)return;
 const ms=G.mission,m=ms?ms.m:null;
 const ix=P.pax.findIndex(p=>p.dest===n.key);
 if(ix>=0){
  P.pax.splice(ix,1);P.boardT=0.35;AU.ding();SV.pax++;G.session.pax++;syncPax();if(ms)ms.delivered++;
  if(!ms){addXP(2);}
  return;
 }
 const s=stopWaiting(n);
 const cap=P.def.seats;
 if(ms){
  if(ms.phase==='toStart'&&n.key===m.start.key&&s.n>0&&P.pax.length<cap){
   P.pax.push({dest:m.dest.key,fare:m.fare});s.n--;P.boardT=0.4;addMoney(m.fare);G.session.earn+=m.fare;AU.ding();syncPax();
  }
  return;
 }
 if(s.n>0&&P.pax.length<cap){
  const dn=pickDest(n);const fare=Math.round(3+(Math.abs(dn.i-n.i)+Math.abs(dn.j-n.j))*4);
  P.pax.push({dest:dn.key,fare:fare});s.n--;P.boardT=0.4;addMoney(fare);G.session.earn+=fare;AU.ding();syncPax();
  if(!G.waypoint&&P.pax.length===1)toast('Passenger heading to '+dn.name,'g');
 }
}
function updateServices(dt){
 const sv=serviceAt(P.x,P.z);G.svc=null;
 if(!sv||Math.abs(P.vf)>1.5)return;
 G.svc=sv;
 if(sv==='fuel'){const mf=maxFuel();if(P.fuel<mf-0.1&&SV.money>0){const lit=Math.min(mf-P.fuel,14*dt);const price=P.def.electric?0.9:1.7;P.fuel+=lit;addMoney(-lit*price);P.engineOn=true;}}
 else if(sv==='repair'){if(P.dmg>0.05&&SV.money>0){const pc=Math.min(P.dmg,12*dt);P.dmg-=pc;addMoney(-pc*(8+P.def.price/1500));}}
 else if(sv==='rest'){P.temp=Math.max(40,P.temp-12*dt);P.sat=Math.min(100,P.sat+6*dt);}
 if(SV.money<0)SV.money=0;
}

/* ---------- traffic ---------- */
const TR=[],PD=[];
const KINDS=['car','car','car','car','van','truck','moto','bus','car'];
const TCOL=[[.8,.1,.1],[.1,.3,.8],[.9,.9,.9],[.15,.15,.18],[.9,.7,.1],[.2,.6,.3],[.6,.6,.65],[.9,.4,.1],[.5,.2,.6]];
function laneCenter(ax,L,a,dir,out){
 const c0=ax?Zc(L,a):Xc(L,a),c1=ax?Zc(L,a+dir*2):Xc(L,a+dir*2);
 const slope=(c1-c0)/(dir*2);
 const fx=ax?dir:dir*slope,fz=ax?dir*slope:dir;
 const yaw=Math.atan2(fx,fz);
 const cx=ax?a:c0,cz=ax?c0:a;
 out.x=cx+(-Math.cos(yaw))*2.6;out.z=cz+Math.sin(yaw)*2.6;out.yaw=yaw;
 const hf=(roadH(ax,L,a+dir*2)-roadH(ax,L,a))/2;
 out.y=roadH(ax,L,a)+0.1;out.pitch=Math.atan(hf);
}
const LC={x:0,z:0,yaw:0,y:0,pitch:0};
function spawnTraffic(){
 const ax=Math.random()<0.5?0:1;
 const perp=ax?P.z:P.x,along=ax?P.x:P.z;
 const L=Math.round(perp/S)+Math.floor(Math.random()*3)-1;
 const dir=Math.random()<0.5?-1:1;
 const a=along+(Math.random()<0.5?-1:1)*(70+Math.random()*90);
 laneCenter(ax,L,a,dir,LC);
 if(!WORLD.chunks.has(ckey(Math.floor(LC.x/CS),Math.floor(LC.z/CS))))return;
 if(Math.hypot(LC.x-P.x,LC.z-P.z)<50)return;
 for(const v of TR){if(v.ax===ax&&v.L===L&&v.dir===dir&&Math.abs(v.a-a)<25)return;}
 const nodeD=Math.abs(a-Math.round(a/S)*S);if(nodeD<14)return;
 const kind=KINDS[Math.floor(Math.random()*KINDS.length)];const mdl=VEH[kind];
 const g=segInfo(ax,L,Math.floor(a/S));
 const vt=g.limit/3.6*(0.6+Math.random()*0.2)*(kind==='truck'||kind==='bus'?0.85:1)*(kind==='moto'?1.1:1);
 TR.push({kind:kind,m:mdl,tint:TCOL[Math.floor(Math.random()*TCOL.length)],ax:ax,L:L,a:a,dir:dir,speed:vt*0.8,vt:vt,len:mdl.L,wid:mdl.W,crash:0,hit:false,x:LC.x,z:LC.z,y:LC.y,yaw:LC.yaw,pitch:0,lat:0,dead:false});
}
function updateTraffic(dt){
 const maxN=[0,6,12,20][SET.traffic]||0;
 G.spT-=dt;if(TR.length<maxN&&G.spT<=0){G.spT=0.4;spawnTraffic();}
 const pa=P.def;const pfx=Math.sin(P.yaw),pfz=Math.cos(P.yaw);
 for(let i=TR.length-1;i>=0;i--){
  const v=TR[i];
  const dP=Math.hypot(v.x-P.x,v.z-P.z);
  if(dP>270||v.dead||v.crash>7||TR.length>maxN+2){TR.splice(i,1);continue;}
  let target=v.vt,gap=1e9;
  if(v.crash>0){v.crash+=dt;target=0;v.speed=Math.max(0,v.speed-14*dt);}
  else{
   const nodeA=v.dir>0?(Math.floor(v.a/S)+1)*S:(Math.ceil(v.a/S)-1)*S;
   const dnode=(nodeA-v.a)*v.dir;
   const nn=v.ax?nodeInfo(Math.round(nodeA/S),v.L):nodeInfo(v.L,Math.round(nodeA/S));
   if(nn.city&&nn.valid){const sd=dnode-(HW+3.2+v.len*0.5),st=lightState(nn,v.ax);if(st!==0&&sd>-1&&sd<v.speed*v.speed/7+6)gap=Math.min(gap,Math.max(sd,0)+3);}
   for(const o of TR){if(o!==v&&o.ax===v.ax&&o.L===v.L&&o.dir===v.dir){const dd=(o.a-v.a)*v.dir;if(dd>0&&dd<45)gap=Math.min(gap,dd-(o.len+v.len)/2);}}
   // player in lane
   const pal=v.ax?P.x:P.z,pper=v.ax?P.z:P.x;
   const cen=v.ax?Zc(v.L,pal):Xc(v.L,pal);
   if(Math.abs(pper-cen)<6.5){const dd=(pal-v.a)*v.dir;if(dd>0&&dd<45&&Math.abs(Math.abs(pper-cen)-2.6)<2.4)gap=Math.min(gap,dd-(pa.L+v.len)/2);}
   if(gap<1e8){const safe=Math.max(gap-2.5,0);target=Math.min(target,Math.sqrt(2*3.5*safe));}
   if(v.speed<target)v.speed=Math.min(target,v.speed+2.4*dt);else v.speed=Math.max(target,v.speed-6*dt);
  }
  v.a+=v.dir*v.speed*dt;
  laneCenter(v.ax,v.L,v.a,v.dir,LC);
  v.x=LC.x;v.z=LC.z;v.y=LC.y;v.yaw=LC.yaw;v.pitch=LC.pitch;
  if(v.hit){v.lat=Math.min(2.5,v.lat+dt*3);v.x+=Math.cos(LC.yaw)*v.lat*(v.hitSide||1);v.z-=Math.sin(LC.yaw)*v.lat*(v.hitSide||1);v.yaw+=0.35*(v.hitSide||1)*Math.min(1,v.lat);}
  // collide with player
  if(!v.hit&&G.mode==='play'&&dP<pa.L*0.6+v.len){
   const vfx=Math.sin(v.yaw),vfz=Math.cos(v.yaw);let hitF=false;
   for(const fr of [0.4,0.13,-0.13,-0.4]){
    const cx=P.x+pfx*fr*pa.L,cz=P.z+pfz*fr*pa.L;
    for(const q of [-0.3,0.3]){const ex=v.x+vfx*q*v.len,ez=v.z+vfz*q*v.len;const rr=pa.W/2+v.wid/2+0.1;const dd=Math.hypot(cx-ex,cz-ez);
     if(dd<rr){hitF=true;const nx=(cx-ex)/(dd||1),nz=(cz-ez)/(dd||1);P.x+=nx*(rr-dd)*0.6;P.z+=nz*(rr-dd)*0.6;}}
   }
   if(hitF){
    const rel=Math.hypot(P.vx-vfx*v.speed*(v.dir>0?1:1),P.vz-vfz*v.speed);
    v.hit=true;v.crash=0.01;v.hitSide=((P.x-v.x)*Math.cos(v.yaw)-(P.z-v.z)*Math.sin(v.yaw))>0?-1:1;
    P.vx*=0.6;P.vz*=0.6;hitObstacle(Math.max(rel*0.7,1.3),'Traffic');if(P.sat>0)P.sat=Math.max(0,P.sat-6);
    if(!G.mission){addXP(0);}SV.rep=Math.max(0,SV.rep-1);
   }
  }
 }
}
function spawnPed(){
 const L=Math.round(P.x/S)+Math.floor(Math.random()*3)-1;const ax=0;
 const a=P.z+(Math.random()-0.5)*160;const s=Math.floor(a/S);
 const g=segInfo(ax,L,s);if(g.cls!==0)return;
 const mid=(a-s*S);if(mid<22||mid>S-22)return;
 const side=Math.random()<0.5?-1:1;
 const px=Xc(L,a)+side*(HW+1.5),pz=a;
 if(Math.hypot(px-P.x,pz-P.z)<25)return;
 if(!WORLD.chunks.has(ckey(Math.floor(px/CS),Math.floor(pz/CS))))return;
 PD.push({L:L,s:s,a:a,side:side,dir:Math.random()<0.5?-1:1,spd:1.1+Math.random()*0.5,tint:TCOL[Math.floor(Math.random()*TCOL.length)],ph:Math.random()*6,x:px,z:pz,y:0,dead:0});
}
function updatePeds(dt){
 const maxN=[0,4,8,14][SET.traffic]||0;
 G.pdT-=dt;if(PD.length<maxN&&G.pdT<=0){G.pdT=0.8;spawnPed();}
 for(let i=PD.length-1;i>=0;i--){
  const p=PD[i];if(Math.hypot(p.x-P.x,p.z-P.z)>200||p.dead>6){PD.splice(i,1);continue;}
  if(p.dead>0){p.dead+=dt;continue;}
  p.a+=p.dir*p.spd*dt;const rel=p.a-p.s*S;if(rel<16||rel>S-16)p.dir=-p.dir;
  p.ph+=dt*p.spd*5;p.x=Xc(p.L,p.a)+p.side*(HW+1.5);p.z=p.a;p.y=roadH(0,p.L,p.a)+0.12;
  if(G.mode==='play'){const dd=Math.hypot(p.x-P.x,p.z-P.z);if(dd<P.def.L*0.6+1){
   const fx=Math.sin(P.yaw),fz=Math.cos(P.yaw);
   for(const fr of [0.4,0.13,-0.13,-0.4]){if(Math.hypot(p.x-(P.x+fx*fr*P.def.L),p.z-(P.z+fz*fr*P.def.L))<P.def.W/2+0.4&&Math.abs(P.vf)>1.5){p.dead=0.01;addMoney(-250);SV.rep=Math.max(0,SV.rep-4);P.sat=Math.max(0,P.sat-25);toast('You hit a pedestrian! -'+CUR+'250','r');AU.crash(8);G.shake=0.6;break;}}
  }}
 }
}

/* ---------- missions ---------- */
const MTPL=[
 {k:'city',name:'City Shuttle',desc:'Carry commuters between two downtown stops.',mult:1},
 {k:'highway',name:'Highway Express',desc:'A long highway journey with passengers on board.',mult:1.1},
 {k:'airport',name:'Airport Pickup',desc:'Collect travellers from the airport and bring them to the city.',mult:1.2},
 {k:'village',name:'Mountain Village Transport',desc:'Take villagers to their hillside home.',mult:1.25},
 {k:'night',name:'Night Driving',desc:'Late shift. Watch the dark roads carefully.',mult:1.3,hour:22.5},
 {k:'rain',name:'Rainy Weather Transport',desc:'Wet roads reduce grip. Drive smoothly.',mult:1.3,weather:'rain'},
 {k:'school',name:'School Bus Service',desc:'Children on board - gentle driving is a must.',mult:1,hour:7.5,rec:'school'},
 {k:'emerg',name:'Emergency Passenger Transport',desc:'Urgent! Get them there as fast as you safely can.',mult:1.6,rec:'mini'},
 {k:'pass',name:'Difficult Mountain Route',desc:'Steep, twisty, dangerous. Tunnels and cliffs ahead.',mult:1.5},
 {k:'inter',name:'Intercity Transport',desc:'Connect two distant bus terminals.',mult:1.4,rec:'inter'}
];
let MISSIONS=[];
function genMissions(){
 const nodes=[];for(let i=-12;i<=12;i++)for(let j=-12;j<=12;j++){const n=nodeInfo(i,j);if(n.valid)nodes.push(n);}
 const city=nodes.filter(n=>n.city),term=nodes.filter(n=>n.poi==='terminal'||n.poi==='airport'||n.city),air=nodes.filter(n=>n.poi==='airport'),vill=nodes.filter(n=>n.poi==='village'),
 mtn=nodes.slice().sort((a,b)=>b.mt-a.mt).slice(0,20),terms=nodes.filter(n=>n.poi==='terminal');
 const man=(a,b)=>Math.abs(a.i-b.i)+Math.abs(a.j-b.j);
 const pick=(pool,from,steps,rng)=>{let best=null,bs=1e9;for(const n of pool){if(n.key===from.key)continue;const sc=Math.abs(man(from,n)-steps)+rng()*1.2;if(sc<bs){bs=sc;best=n;}}return best||nodes[0];};
 const rngPick=(pool,rng)=>pool.length?pool[Math.floor(rng()*pool.length)]:nodes[Math.floor(rng()*nodes.length)];
 MISSIONS=[];let idx=0;
 for(let tier=0;tier<3;tier++)for(let t=0;t<MTPL.length;t++){
  const tp=MTPL[t],rng=mulberry(1000+idx*77);
  let steps=[2,4,6][tier];if(tp.k==='highway'||tp.k==='inter')steps+=2;if(tp.k==='emerg')steps=Math.max(2,steps-1);if(tp.k==='city'||tp.k==='night')steps=[2,3,5][tier];
  let from,to;
  switch(tp.k){
   case 'city':case 'night':from=rngPick(city.length?city:term,rng);to=pick(city.length?city:nodes,from,steps,rng);break;
   case 'airport':from=air.length?air[tier%air.length]:rngPick(term,rng);to=pick(city.length?city:nodes,from,steps,rng);break;
   case 'village':from=rngPick(term,rng);to=pick(vill.length?vill:nodes,from,steps,rng);break;
   case 'school':from=rngPick(vill.length?vill:nodes,rng);to=pick(vill.length?vill:nodes,from,steps,rng);break;
   case 'pass':from=rngPick(nodes,rng);to=pick(mtn,from,steps,rng);break;
   case 'inter':from=rngPick(terms.length?terms:term,rng);to=pick(terms.length?terms:term,from,steps,rng);break;
   default:from=rngPick(term,rng);to=pick(nodes,from,steps,rng);
  }
  const dist=man(from,to)*S;
  let pax=Math.round(8+tier*5+rng()*6);if(tp.k==='emerg')pax=4+tier;if(tp.k==='school')pax=14+tier*4;
  let limit=Math.round(dist/[7.5,9,10.5][tier]+80);if(tp.k==='emerg')limit=Math.round(dist/12+50);if(tp.k==='school'||(tp.k==='city'&&tier===0)||tp.k==='village')limit=0;
  const reward=Math.round((dist*0.3+pax*10)*(1+tier*0.45)*tp.mult/10)*10;
  MISSIONS.push({id:idx,tier:tier,name:tp.name+(tier?' '+['','II','III'][tier]:''),desc:tp.desc,kind:tp.k,start:{i:from.i,j:from.j,key:from.key,name:from.name},dest:{i:to.i,j:to.j,key:to.key,name:to.name},dist:dist,pax:pax,limit:limit,hour:tp.hour||null,weather:tp.weather||null,fare:Math.max(2,Math.round(3+dist/90)),reward:Math.max(80,reward),xp:Math.round(40+tier*45+dist/12),minLevel:1+Math.floor(idx/5),rec:tp.rec||null,diff:['Easy','Medium','Hard'][tier]});
  idx++;
 }
}
const doneCount=()=>Object.keys(SV.done).length;
function missionUnlocked(m){return m.id<2||doneCount()>=m.id-1;}
function startMission(m){
 if(SV.level<m.minLevel){toast('Requires level '+m.minLevel,'r');return;}
 if(!missionUnlocked(m)){toast('Complete more missions to unlock this one','r');return;}
 const s=nodeInfo(m.start.i,m.start.j);
 const z=s.z-75;
 launchGame(()=>{
  setBus(SV.sel);
  placePlayer(Xc(s.i,z)-2.6,z,0);P.safe={x:P.x,z:P.z,yaw:0};
  P.pax=[];syncPax();P.sat=100;P.fuel=Math.min(maxFuel(),Math.max(P.fuel,maxFuel()*0.7));P.dmg=Math.min(P.dmg,60);
  const pax=Math.min(m.pax,P.def.seats);
  G.mission={m:m,phase:'toStart',timeLeft:m.limit,delivered:0,pax:pax,t:0,startDmg:P.dmg};
  STOPS.set(s.key,{n:pax,t:0});
  if(m.hour!==null){G.time=m.hour;G.timeLock=true;}else G.timeLock=false;
  if(m.weather==='rain'){G.weather.tRain=1;G.weather.rain=0.8;G.weatherLock=true;}else{G.weatherLock=false;G.weather.tRain=0;}
  G.waypoint=null;G.cam=0;toast('Mission: '+m.name,'g');
 });
}
function updateMission(dt){
 const ms=G.mission;if(!ms)return;
 ms.t+=dt;const m=ms.m;
 if(ms.phase==='toStart'){if(P.pax.length>=ms.pax||(P.pax.length>0&&STOPS.get(m.start.key)&&STOPS.get(m.start.key).n<=0)){ms.phase='toDest';ms.boarded=P.pax.length;toast('All aboard! Drive to '+m.dest.name,'g');AU.coin();}}
 if(ms.phase==='toDest'){
  if(m.limit>0){ms.timeLeft-=dt;if(ms.timeLeft<=0){endMission(false,'Time is up!');return;}}
  if(P.pax.length===0){endMission(true);return;}
 }
 if(P.sat<=0){endMission(false,'Passengers are furious!');return;}
 if(P.dmg>=100){endMission(false,'Your bus was destroyed!');return;}
}
function endMission(ok,why){
 const ms=G.mission;if(!ms||ms.done)return;ms.done=true;const m=ms.m;
 const lines=[];let money=0,xp=0;
 if(ok){
  const tb=m.limit>0?clamp(ms.timeLeft/m.limit,0,1):0.3;
  const sb=P.sat/100;const dp=Math.max(0,1-(P.dmg-ms.startDmg)/100);
  const recB=(m.rec&&P.def.id===m.rec)?1.25:1;
  money=Math.round(m.reward*(0.8+0.2*sb)*(0.9+0.2*tb)*dp*recB);xp=Math.round(m.xp*(0.7+0.3*sb)*recB);
  lines.push(['Base reward',CUR+m.reward]);lines.push(['Time bonus',Math.round(tb*100)+'%']);lines.push(['Passenger satisfaction',Math.round(P.sat)+'%']);if(recB>1)lines.push(['Recommended bus bonus','+25%']);
  lines.push(['Total reward',CUR+money]);lines.push(['XP gained','+'+xp]);
  addMoney(money);addXP(xp);SV.done[m.id]=1;SV.rep=clamp(SV.rep+(P.sat>80?3:1),0,100);AU.win();
 }else{
  const fine=Math.round(m.reward*0.1);addMoney(-fine);if(SV.money<0)SV.money=0;SV.rep=clamp(SV.rep-3,0,100);lines.push(['Reason',why||'Failed']);lines.push(['Penalty','-'+CUR+fine]);AU.fail();
 }
 P.pax=[];syncPax();saveAll();showResult(ok,m,lines);
}
function abortMission(){if(G.mission){G.mission=null;P.pax=[];syncPax();toast('Mission aborted');}}

/* ---------- navigation ---------- */
function navTarget(){
 const ms=G.mission;
 if(ms){return nodeInfo(ms.phase==='toStart'?ms.m.start.i:ms.m.dest.i,ms.phase==='toStart'?ms.m.start.j:ms.m.dest.j);}
 if(G.waypoint)return G.waypoint;
 if(P.pax.length)return nodeByKey(P.pax[0].dest);
 return null;
}
function computeRoute(){
 const t=navTarget();if(!t){G.route=null;return;}
 const ra=roadAt(P.x,P.z);const pts=[{x:P.x,z:P.z}];
 let corner;if(ra.ax===0)corner={x:ra.L*S,z:t.z};else corner={x:t.x,z:ra.L*S};
 if(Math.hypot(corner.x-t.x,corner.z-t.z)>2)pts.push(corner);
 pts.push({x:t.x,z:t.stopZ!==undefined?t.z:t.z});
 let tot=0;for(let i=1;i<pts.length;i++)tot+=Math.abs(pts[i].x-pts[i-1].x)+Math.abs(pts[i].z-pts[i-1].z);
 G.route={pts:pts,total:tot,target:t};
}

/* ---------- camera ---------- */
const CAM={px:0,py:10,pz:0,tx:0,ty:10,tz:0,fov:1.0,dragYaw:0,dragPitch:0,dragT:0,fyaw:0.5,fpitch:0.35,fdist:18,menuA:0,sh:0};
function updateCamera(dt){
 const d=P.def,L=d.L;
 const fx=Math.sin(P.yaw),fz=Math.cos(P.yaw),lx=Math.cos(P.yaw),lz=-Math.sin(P.yaw);
 let ex,ey,ez,tx,ty,tz,k=6,fov=1.0;
 if(G.mode!=='play'){
  CAM.menuA+=dt*(G.mode==='garage'?0.5:0.12);
  const r=G.mode==='garage'?L*0.95+4:L*0.9+7;
  ex=P.x+Math.cos(CAM.menuA)*r;ez=P.z+Math.sin(CAM.menuA)*r;ey=P.y+(G.mode==='garage'?2.8:3.6);tx=P.x;ty=P.y+1.4;tz=P.z;k=3;
 }else{
  const m=G.cam;
  if(CAM.dragT>0)CAM.dragT-=dt;else{CAM.dragYaw*=Math.exp(-dt*2);CAM.dragPitch*=Math.exp(-dt*2);}
  const sp=clamp(Math.abs(P.vf)/30,0,1);
  if(m===0){
   const dist=L*0.55+8.5,yw=P.yaw+PI+CAM.dragYaw,h=3.8+d.H*0.35+CAM.dragPitch*8;
   ex=P.x+Math.sin(yw)*dist;ez=P.z+Math.cos(yw)*dist;ey=P.y+h;
   tx=P.x+fx*7;tz=P.z+fz*7;ty=P.y+d.H*0.5;fov=1.0+0.18*sp;k=7;
  }else if(m===1){
   const e=P.model.eye;const c=Math.cos(P.yaw),s=Math.sin(P.yaw);
   ex=P.x+e.x*c+e.z*s;ez=P.z-e.x*s+e.z*c;ey=P.y+e.y;
   const yw=P.yaw+CAM.dragYaw*-1,pt=CAM.dragPitch;
   tx=ex+Math.sin(yw)*20;tz=ez+Math.cos(yw)*20;ty=ey+pt*14-0.35+P.pitch*8;fov=1.05;k=40;
  }else if(m===2){
   ex=P.x+fx*(L/2+0.6);ez=P.z+fz*(L/2+0.6);ey=P.y+1.0;tx=ex+fx*25;tz=ez+fz*25;ty=ey+0.4+P.pitch*8;fov=1.1;k=14;
  }else if(m===3){
   ex=P.x-fx*(L/2+0.7);ez=P.z-fz*(L/2+0.7);ey=P.y+d.H*0.85;tx=ex-fx*25;tz=ez-fz*25;ty=ey-1.5;fov=1.15;k=14;
  }else{
   const r=CAM.fdist;ex=P.x+Math.cos(CAM.fyaw)*Math.cos(CAM.fpitch)*r;ez=P.z+Math.sin(CAM.fyaw)*Math.cos(CAM.fpitch)*r;ey=P.y+Math.sin(CAM.fpitch)*r+1.5;tx=P.x;ty=P.y+1.5;tz=P.z;k=10;
  }
 }
 const a=1-Math.exp(-dt*k);
 CAM.px+=(ex-CAM.px)*a;CAM.py+=(ey-CAM.py)*a;CAM.pz+=(ez-CAM.pz)*a;
 CAM.tx+=(tx-CAM.tx)*a;CAM.ty+=(ty-CAM.ty)*a;CAM.tz+=(tz-CAM.tz)*a;
 CAM.fov+=(fov-CAM.fov)*Math.min(1,dt*3);
 if(G.shake>0){G.shake=Math.max(0,G.shake-dt*1.5);}
 if(!(G.mode==='play'&&G.cam===1)){const gh=groundY(CAM.px,CAM.pz);if(CAM.py<gh+0.8)CAM.py=gh+0.8;}
}

 for(let ax=0;ax<2;ax++){
  const lo=ax?z0:x0,hi=ax?z1:x1,a0=ax?x0:z0,a1=ax?x1:z1;
  for(let L=Math.ceil((lo-20)/S);L<=Math.floor((hi+20)/S);L++){
   for(let a=Math.floor(a0/step)*step;a<a1;a+=step){
    const b=a+step,c0=ax?Zc(L,a):Xc(L,a),c1=ax?Zc(L,b):Xc(L,b);
    const px0=ax?a:c0,pz0=ax?c0:a,px1=ax?b:c1,pz1=ax?c1:b;
    pieces.push([X(px0),Y(pz0),X(px1),Y(pz1),segInfo(ax,L,Math.floor((a+step/2)/S)).cls]);
   }
  }
 }
 const w=Math.max(2.5,HW*2*s);
 ctx.strokeStyle='#0b1220';ctx.lineWidth=w+2;
 ctx.beginPath();for(const p of pieces){ctx.moveTo(p[0],p[1]);ctx.lineTo(p[2],p[3]);}ctx.stroke();
 ctx.lineWidth=w;
 for(let c=0;c<6;c++){ctx.strokeStyle=RDCOL[c];ctx.beginPath();let any=false;for(const p of pieces){if(p[4]!==c)continue;ctx.moveTo(p[0],p[1]);ctx.lineTo(p[2],p[3]);any=true;}if(any)ctx.stroke();}
 // nodes
 const iconR=Math.max(3.5,Math.min(8,s*16));
 for(let i=Math.floor(x0/S);i<=Math.ceil(x1/S);i++)for(let j=Math.floor(z0/S);j<=Math.ceil(z1/S);j++){
  const n=nodeInfo(i,j);if(!n.valid)continue;const px=X(n.x),py=Y(n.z);

   if(letters){ctx.save();ctx.translate(px,py);ctx.rotate(-rot);ctx.fillStyle='#000';ctx.font='bold '+Math.round(iconR*1.3)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(c[1],0,1);ctx.restore();}}

 }

 // markers
 const mk=(n,col,txt)=>{const px=X(n.x),py=Y(n.z-11);const pr=iconR+3+Math.sin(G.t*4)*1.5;ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(px,py,pr,0,TAU);ctx.stroke();ctx.fillStyle=col;ctx.beginPath();ctx.arc(px,py,3,0,TAU);ctx.fill();
  if(txt&&letters){ctx.save();ctx.translate(px,py);ctx.rotate(-rot);ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.strokeText(txt,0,-pr-6);ctx.fillText(txt,0,-pr-6);ctx.restore();}};
 const ms=G.mission;
 if(ms){const t=navTarget();if(t)mk(t,ms.phase==='toStart'?'#4ade80':'#f87171',ms.phase==='toStart'?'PICKUP':'DROP-OFF');}
 else if(G.waypoint)mk(G.waypoint,'#22d3ee','GPS');

}

function mapNodeAt(mx,my){

/* ---------- game flow ---------- */
let LAUNCH=null;

 E('menu').classList.remove('on');E('panel').classList.remove('on');E('pause').classList.remove('on');E('result').classList.remove('on');

/* ---------- main loop ---------- */
let lastTs=performance.now(),fpsSm=60,adT=0,errShown=false;
function update(dt){
 G.t+=dt;pollInput(dt);
 if(G.mode==='loading'){
  const need=Math.min(40,Math.round(Math.PI*WORLD.R*WORLD.R*0.85));
  updateWorld(P.x,P.z,14);
  const prog=clamp(WORLD.chunks.size/Math.max(need,1),0,1);E('loadBar').style.width=(prog*100)+'%';
  LAUNCH.t+=dt;
  if(WORLD.queue.length===0&&WORLD.chunks.size>=Math.min(need,12)||LAUNCH.t>20){G.mode='play';E('loading').classList.remove('on');G.paused=false;P.y=groundY(P.x,P.z);CAM.menuA=0;toast(G.mission?'Drive to the pickup bus stop (blue marker) and stop there':'Free roam: stop at blue bus stops to pick up passengers. C = camera, P = pause','g');}
  updateCamera(dt);return;
 }
 const active=!(G.mode==='play'&&G.paused);
 if(G.mode==='play'&&!G.paused){updateEnv(dt);updatePlayer(dt);updateStops(dt);updateServices(dt);updateMission(dt);}
 else if(G.mode!=='play'){updateEnv(dt);}
 updateWorld(P.x,P.z,G.mode==='play'?3.5:6);
 if(active){updateTraffic(dt);updatePeds(dt);updateParticles(dt);}
 updateCamera(dt);
 // audio
 const spd=Math.abs(P.vf);
 AU.update({rpm:P.rpm,thr:P.thr,spd:spd,rain:G.weather.rain,brake:(P.brk>0.3&&spd>6)||(P.hand>0.5&&spd>6)?clamp(spd/20,0,1)*0.8:0,horn:P.horn&&G.mode==='play'&&!G.paused,traffic:clamp(TR.length/12,0,1)*(G.mode==='play'?1:0.3),on:G.mode==='play'&&!G.paused&&P.engineOn&&P.fuel>0&&P.dmg<100,cab:G.cam===1});
 if((P.indL||P.indR)&&G.mode==='play'&&!G.paused){G.indT=(G.indT||0)+dt;if(G.indT>0.38){G.indT=0;AU.indTick();}}
}
function frame(ts){
 requestAnimationFrame(frame);
 const minDt=SET.fps>=120?0:1000/SET.fps-2;const el=ts-lastTs;if(el<minDt)return;lastTs=ts;
 const dt=Math.min(el/1000,0.05);fpsSm+=(1/Math.max(el/1000,0.001)-fpsSm)*0.05;G.fps=fpsSm;
 try{
  update(dt);render();updateHUD(dt);
  adT+=dt;if(adT>2){adT=0;if(SET.adaptive&&G.mode==='play'){const target=Math.min(SET.fps>=120?60:SET.fps,60);if(fpsSm<target*0.72)G.resScale=Math.max(0.55,G.resScale-0.08);else if(fpsSm>target*0.93&&G.resScale<1)G.resScale=Math.min(1,G.resScale+0.04);}}
 }catch(err){if(!errShown){errShown=true;console.error(err);}}
}

 E('loadTip').textContent='Tip: '+tips[Math.floor(Math.random()*tips.length)];
 applySettings();
 const steps=[
  ['Generating missions...',()=>{genMissions();}],
  ['Building bus models...',()=>{BUSES.forEach(b=>getBusModel(b.id));if(!SV.owned[SV.sel])SV.sel='city';}],
  ['Preparing world...',()=>{enterMenu();}],
 ];
 let i=0;
 const run=()=>{
  if(i<steps.length){E('loadTxt').textContent=steps[i][0];E('loadBar').style.width=(i/(steps.length+1)*60)+'%';const fn=steps[i][1];i++;setTimeout(()=>{try{fn();}catch(e){console.error(e);}run();},30);}
  else waitWorld();
 };
 const waitWorld=()=>{
  updateWorld(P.x,P.z,16);
  const need=Math.round(Math.PI*WORLD.R*WORLD.R*0.8);
  const prog=clamp(WORLD.chunks.size/need,0,1);E('loadBar').style.width=(60+prog*40)+'%';E('loadTxt').textContent='Building terrain... '+WORLD.chunks.size+' chunks';
  if(WORLD.queue.length===0&&WORLD.chunks.size>5){E('loading').classList.remove('on');updateCamera(0.5);requestAnimationFrame(frame);}
  else setTimeout(waitWorld,16);
 };
 run();
})();

</script>
